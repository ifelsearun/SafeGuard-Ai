services:
  - type: web
    name: safeguard-api
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: VIRUSTOTAL_API_KEY
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
